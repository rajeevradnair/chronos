apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-crm

spec:
  replicas: 1

  selector:
    matchLabels:
      app: chronos-crm

  template:
    metadata:
      labels:
        app: chronos-crm

    spec:
      containers:
        - name: chronos-crm
          image: 280480953008.dkr.ecr.us-west-2.amazonaws.com/chronos-dev:crm-v2

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: chronos-crm-db

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chronos-crm

spec:
  selector:
    app: chronos-crm

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP