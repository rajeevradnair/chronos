apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-health
spec:
  replicas: 1

  selector:
    matchLabels:
      app: chronos-health

  template:
    metadata:
      labels:
        app: chronos-health

    spec:
      containers:
        - name: chronos-health
          image: 280480953008.dkr.ecr.us-west-2.amazonaws.com/chronos-dev:health-v2

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chronos-health
spec:
  selector:
    app: chronos-health

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP