apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-knowledge

spec:
  replicas: 1

  selector:
    matchLabels:
      app: chronos-knowledge

  template:
    metadata:
      labels:
        app: chronos-knowledge

    spec:
      containers:
        - name: knowledge

          image: 280480953008.dkr.ecr.us-west-2.amazonaws.com/chronos-dev:knowledge-v1

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: chronos-knowledge-db

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: chronos-knowledge

spec:
  selector:
    app: chronos-knowledge

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP